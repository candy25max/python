<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GlimUp — Telegram Gifts & Upgrader</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-main: #0b0e13;
      --bg-card: #121720;
      --bg-card-2: #181f2b;
      --border: rgba(255, 255, 255, 0.08);
      --gold: #facc15;
      --gold-dark: #eab308;
      --orange: #f97316;
      --blue: #2563eb;
      --green: #16a34a;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg-main);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 88px;
      overflow-x: hidden;
    }

    body.shake-loss {
      animation: screenShake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      box-shadow: inset 0 0 60px rgba(239, 68, 68, 0.45);
    }

    @keyframes screenShake {
      10%, 90% { transform: translate3d(-4px, 0, 0); }
      20%, 80% { transform: translate3d(5px, 2px, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, -2px, 0); }
      40%, 60% { transform: translate3d(6px, 2px, 0); }
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      padding: 12px 14px 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(18, 23, 32, 0.94);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 12px;
      margin-bottom: 14px;
      position: sticky;
      top: 10px;
      z-index: 30;
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 17px;
    }

    .brand-badge {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--gold), var(--orange));
      color: #111;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 16px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang-switch {
      display: flex;
      background: var(--bg-card-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 2px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      font-size: 11px;
      padding: 5px 8px;
      border-radius: 8px;
      cursor: pointer;
    }

    .lang-btn.active {
      background: var(--gold);
      color: #111;
    }

    .balance-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card-2);
      border: 1px solid rgba(250, 204, 21, 0.28);
      border-radius: 12px;
      padding: 6px 11px;
      font-weight: 800;
      font-size: 13px;
    }

    .cases-header-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin: 4px 0 14px;
    }

    .cases-header-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.3px;
    }

    .cases-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .case-card {
      position: relative;
      background: radial-gradient(circle at 50% 25%, rgba(45, 78, 86, 0.42), rgba(15, 20, 28, 0.96) 72%);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 16px;
      padding: 12px 10px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.14s ease;
      overflow: hidden;
    }

    .case-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      height: 3px;
      border-radius: 0 0 4px 4px;
      background: var(--accent, #38bdf8);
    }

    .case-card:active {
      transform: scale(0.97);
    }

    .case-card:hover {
      border-color: rgba(250, 204, 21, 0.45);
    }

    .case-art-wrap {
      width: 100%;
      height: 138px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
      position: relative;
    }

    .case-art-img {
      width: 126px;
      height: 126px;
      object-fit: contain;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.55));
    }

    .case-art-emoji {
      font-size: 74px;
      line-height: 1;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.55));
    }

    .case-name {
      font-weight: 800;
      font-size: 16px;
      color: #fff;
      margin-bottom: 4px;
    }

    .case-max-drop {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .case-price-bar {
      width: 100%;
      background: rgba(10, 14, 20, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 800;
      font-size: 14px;
      color: #fff;
    }

    .star-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--gold);
      color: #111;
      font-size: 11px;
      font-weight: 900;
    }

    .case-fullscreen {
      position: fixed;
      inset: 0;
      background: var(--bg-main);
      z-index: 80;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      padding: 12px 14px 96px;
    }

    .case-fullscreen.open {
      display: flex;
    }

    .case-fs-inner {
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    .case-fs-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .case-fs-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .circle-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg-card-2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 16px;
      font-weight: 800;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .case-fs-title {
      font-size: 19px;
      font-weight: 800;
    }

    .turbo-toggle {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-card-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      cursor: pointer;
    }

    .turbo-toggle.active {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(250, 204, 21, 0.12);
    }

    .case-fs-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 0 18px;
      min-height: 230px;
    }

    .case-fs-hero-img {
      width: 185px;
      height: 185px;
      object-fit: contain;
      filter: drop-shadow(0 16px 28px rgba(0, 0, 0, 0.65));
      transition: transform 0.35s ease;
    }

    .case-fs-hero-emoji {
      font-size: 118px;
      line-height: 1;
      filter: drop-shadow(0 16px 28px rgba(0, 0, 0, 0.65));
      transition: transform 0.35s ease;
    }

    .case-fs-hero-spinning {
      animation: pulseCase 0.55s ease-in-out infinite alternate;
    }

    @keyframes pulseCase {
      from { transform: scale(0.95) rotate(-3deg); }
      to { transform: scale(1.06) rotate(3deg); }
    }

    .case-action-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 310px;
      width: 100%;
      margin: 0 auto 14px;
    }

    .btn-open-case {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px 16px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #111;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-open-case.insufficient {
      background: #33181d;
      color: #f87171;
      border: 1px solid rgba(248, 113, 113, 0.25);
    }

    .btn-topup-hint {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 13px 16px;
      background: #103824;
      color: #4ade80;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .multiplier-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      max-width: 340px;
      width: 100%;
      margin: 0 auto 18px;
    }

    .mult-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 800;
      font-size: 13px;
      padding: 8px 0;
      border-radius: 9px;
      cursor: pointer;
    }

    .mult-btn.active {
      background: var(--blue);
      color: #fff;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 12px 0 10px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text);
    }

    .section-sub {
      font-size: 12px;
      color: var(--muted);
    }

    .gifts-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .gift-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      cursor: pointer;
    }

    .gift-card.selected {
      border-color: var(--gold);
      box-shadow: 0 0 0 1px var(--gold);
    }

    .gift-thumb {
      width: 58px;
      height: 58px;
      border-radius: 12px;
      background: var(--bg-card-2);
      display: grid;
      place-items: center;
      font-size: 26px;
      overflow: hidden;
    }

    .gift-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gift-name {
      font-size: 11px;
      font-weight: 600;
      line-height: 1.25;
      max-height: 28px;
      overflow: hidden;
    }

    .gift-price-bottom {
      font-size: 11px;
      font-weight: 800;
      color: var(--gold);
      background: rgba(250, 204, 21, 0.1);
      padding: 2px 7px;
      border-radius: 8px;
      width: 100%;
    }

    .upgrader-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
    }

    .upgrader-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .upgrader-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 900;
      font-size: 15px;
      letter-spacing: 0.6px;
      color: var(--gold);
    }

    .icon-btn {
      background: var(--bg-card-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .icon-btn.active {
      border-color: var(--gold);
      color: var(--gold);
    }

    .wheel-wrap {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 8px auto 16px;
      display: grid;
      place-items: center;
    }

    .wheel-ring {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(
        var(--gold) 0deg var(--chance-deg, 0deg),
        #232732 var(--chance-deg, 0deg) 360deg
      );
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 22px), #000 calc(100% - 21px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 22px), #000 calc(100% - 21px));
      transform: rotate(-90deg);
      transition: background 0.25s ease;
    }

    .pointer-rotator {
      position: absolute;
      inset: 0;
      transform: rotate(0deg);
      transition: transform 2.4s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .pointer-rotator.turbo {
      transition-duration: 0.65s;
    }

    .pointer-arrow {
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-top: 18px solid var(--orange);
      filter: drop-shadow(0 0 6px rgba(249, 115, 22, 0.7));
    }

    .wheel-center {
      position: absolute;
      width: 146px;
      height: 146px;
      border-radius: 50%;
      background: #111318;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px;
    }

    .chance-val {
      font-size: 24px;
      font-weight: 900;
      color: var(--gold);
    }

    .chance-label {
      font-size: 11px;
      color: var(--muted);
    }

    .slots-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .slot-box {
      background: var(--bg-card-2);
      border: 1px dashed rgba(250, 204, 21, 0.35);
      border-radius: 14px;
      padding: 12px;
      min-height: 112px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 6px;
      cursor: pointer;
    }

    .slot-title {
      font-size: 12px;
      font-weight: 700;
    }

    .slot-sub {
      font-size: 11px;
      color: var(--muted);
    }

    .bet-controls {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .bet-input {
      flex: 1;
      min-width: 110px;
      background: var(--bg-card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 12px;
      color: var(--text);
      font-weight: 700;
      font-size: 13px;
    }

    .primary-btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 13px 16px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #111;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
    }

    .primary-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .secondary-btn {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      background: var(--bg-card-2);
      color: var(--text);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      margin-top: 8px;
    }

    .status-banner {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      display: none;
    }

    .status-banner.show {
      display: block;
    }

    .status-banner.win {
      background: rgba(34, 197, 94, 0.16);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #86efac;
    }

    .status-banner.lose {
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 13px;
      margin-bottom: 10px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(13, 17, 24, 0.97);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(14px);
      display: flex;
      justify-content: space-around;
      padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
      z-index: 90;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 10px;
    }

    .nav-btn.active {
      color: var(--gold);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.76);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 95;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 440px;
      max-height: 85vh;
      overflow-y: auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .modal-title {
      font-weight: 800;
      font-size: 16px;
    }

    .close-x {
      background: var(--bg-card-2);
      border: 1px solid var(--border);
      color: var(--text);
      width: 30px;
      height: 30px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    .info-box {
      background: var(--bg-card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
      margin-top: 10px;
    }

    .price-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(250, 204, 21, 0.14);
      color: var(--gold);
      border: 1px solid rgba(250, 204, 21, 0.3);
      border-radius: 10px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 800;
      width: fit-content;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-badge">G</div>
        <span>GlimUp</span>
      </div>
      <div class="topbar-right">
        <div class="lang-switch">
          <button type="button" class="lang-btn active" id="langRu" onclick="setLang('ru')">RU</button>
          <button type="button" class="lang-btn" id="langEn" onclick="setLang('en')">EN</button>
        </div>
        <div class="balance-pill">
          <span class="star-badge">⭐</span>
          <span id="balanceDisplay">0</span>
        </div>
      </div>
    </header>

    <main id="tab-cases">
      <div class="cases-header-bar">
        <h2 class="cases-header-title" id="casesSectionTitle">Кейсы</h2>
      </div>
      <div class="cases-grid" id="casesGrid"></div>
    </main>

    <main id="tab-upgrade" style="display:none;">
      <div class="upgrader-box">
        <div class="upgrader-top">
          <div class="upgrader-title">
            <span>⚡</span>
            <span>UPGRADER</span>
          </div>
          <div style="display:flex; gap:6px;">
            <button type="button" class="icon-btn" id="turboBtn" onclick="toggleTurbo()">⚡ TURBO</button>
            <button type="button" class="icon-btn active" id="soundBtn" onclick="toggleSound()">🔊</button>
          </div>
        </div>

        <div class="wheel-wrap">
          <div class="wheel-ring" id="wheelRing" style="--chance-deg: 0deg;"></div>
          <div class="pointer-rotator" id="pointerRotator">
            <div class="pointer-arrow"></div>
          </div>
          <div class="wheel-center">
            <div class="chance-val" id="chanceDisplay">0.0%</div>
            <div class="chance-label" id="chanceLabel">Шанс апгрейда</div>
          </div>
        </div>

        <div class="slots-row">
          <div class="slot-box" onclick="openInventoryPicker()">
            <div id="fromSlotContent">
              <div class="slot-title" id="fromSlotTitle">Ваша ставка (⭐)</div>
              <div class="slot-sub" id="fromSlotSub">Баланс или предмет</div>
            </div>
          </div>
          <div class="slot-box" onclick="openTargetPicker()">
            <div id="toSlotContent">
              <div class="slot-title" id="toSlotTitle">Цель апгрейда</div>
              <div class="slot-sub" id="toSlotSub">Выберите подарок</div>
            </div>
          </div>
        </div>

        <div class="bet-controls">
          <input type="number" class="bet-input" id="upgradeBetInput" min="10" step="10" value="0" oninput="recalcUpgrade()" />

      renderCases();

      document.getElementById("fsBalanceDisplay").textContent = num;
      document.getElementById("profileBalance").textContent = `${num} ⭐`;
      if (state.currentCaseId) {
        updateCaseFsActionButtons();
      }
    }

    function switchTab(tabName) {
      closeCaseFullscreen();
      ["cases", "upgrade", "gifts", "profile"].forEach(name => {
        document.getElementById(`tab-${name}`).style.display = name === tabName ? "block" : "none";
        document.getElementById(`nav-${name}`).classList.toggle("active", name === tabName);

      if (tabName === "cases") renderCases();

      if (tabName === "gifts") renderCatalog();

    function renderGiftArt(gift) {
      const customSrc = state.customPhotos[gift.id];
      const fallback = gift.emoji || "🎁";
      if (customSrc) {
        return `<img class="gift-img" src="${customSrc}" alt="${gift.name}" onerror="this.outerHTML='<span>${fallback}</span>'" />`;
      }
      return `<span>${fallback}</span>`;
    }

    function renderCaseArt(caseObj, hero = false) {
      const customSrc = state.customPhotos[caseObj.id];
      const cls = hero ? "case-fs-hero-img" : "case-art-img";
      const emojiCls = hero ? "case-fs-hero-emoji" : "case-art-emoji";
      const idAttr = hero ? ' id="caseFsArtEl"' : "";
      const fallbackEmoji = caseObj.icon || "📦";
      if (customSrc) {
        return `<img class="${cls}"${idAttr} src="${customSrc}" alt="${caseObj.nameRu}" onerror="this.outerHTML='<div class=\\'${emojiCls}\\'${idAttr}>${fallbackEmoji}</div>'" />`;
      }
      return `<div class="${emojiCls}"${idAttr}>${fallbackEmoji}</div>`;
    }

    function getCaseMaxReward(caseObj) {
      return Math.max(...caseObj.drops.map(d => getGiftById(d.giftId).price));
    }

    function renderCases() {
      const grid = document.getElementById("casesGrid");
      if (!grid) return;
      grid.innerHTML = CASES_DATA.map(c => {
        const title = state.lang === "ru" ? c.nameRu : c.nameEn;
        const maxReward = getCaseMaxReward(c).toLocaleString("ru-RU");
        return `
          <div class="case-card" style="--accent: ${c.accent};" onclick="openCaseFullscreen('${c.id}')">
            <div class="case-art-wrap">
              ${renderCaseArt(c, false)}
            </div>
            <div class="case-name">${title}</div>
            <div class="case-max-drop">⭐ ${t("upTo")} ${maxReward}</div>

      updateCaseFsActionButtons();

    function updateCaseFsActionButtons() {
      const caseObj = CASES_DATA.find(c => c.id === state.currentCaseId);
      if (!caseObj) return;
      const totalCost = caseObj.price * state.caseMultiplier;
      const mainBtn = document.getElementById("caseFsMainBtn");
      const topupHint = document.getElementById("caseFsTopupHint");

      if (state.balance < totalCost) {
        const missing = (totalCost - state.balance).toLocaleString("ru-RU");
        mainBtn.classList.add("insufficient");
        mainBtn.innerHTML = `${t("notEnoughShort")} ⭐ ${missing}`;
        topupHint.style.display = "block";
      } else {
        mainBtn.classList.remove("insufficient");
        mainBtn.innerHTML = `${t("openFor")} ⭐ ${totalCost.toLocaleString("ru-RU")}`;
        topupHint.style.display = "none";
      }
    }

    function notifyTopupInBot() {
      const topupBtn = document.getElementById("caseFsTopupHint");
      topupBtn.textContent = t("topupBotHint");
      setTimeout(() => {
        topupBtn.textContent = t("topupAction");
      }, 2400);
    }

    function pickWeightedDrop(drops) {
      const totalWeight = drops.reduce((acc, item) => acc + item.weight, 0);
      let roll = Math.random() * totalWeight;
      for (const item of drops) {
        roll -= item.weight;
        if (roll <= 0) return getGiftById(item.giftId);
      }
      return getGiftById(drops[0].giftId);
    }

    function spinCurrentCase() {
      if (state.busy || !state.currentCaseId) return;
      const caseObj = CASES_DATA.find(c => c.id === state.currentCaseId);
      if (!caseObj) return;
      const totalCost = caseObj.price * state.caseMultiplier;
      if (state.balance < totalCost) {
        notifyTopupInBot();
        return;
      }

      state.busy = true;
      state.balance -= totalCost;
      updateBalanceUI();

      const artEl = document.getElementById("caseFsArtEl");
      if (artEl) artEl.classList.add("case-fs-hero-spinning");

      const waitMs = state.turbo ? 350 : 950;
      setTimeout(() => {
        const wonItems = [];
        for (let i = 0; i < state.caseMultiplier; i++) {
          const won = pickWeightedDrop(caseObj.drops);
          wonItems.push(won);
          state.inventory.unshift({ ...won, uid: Date.now() + Math.random() + i });
        }

        playTone(540, 0.14);
        renderInventory();

        const stage = document.getElementById("caseFsStage");
        if (wonItems.length === 1) {
          const single = wonItems[0];
          stage.innerHTML = `
            <div style="font-size:12px; color:var(--muted); margin-bottom:8px;">${t("dropped")}</div>
            <div style="width:110px; height:110px; border-radius:20px; background:var(--bg-card); border:1px solid var(--border); display:grid; place-items:center; font-size:56px; overflow:hidden; margin-bottom:10px;">
              ${renderGiftArt(single)}
            </div>
            <div style="font-weight:900; font-size:18px; margin-bottom:6px;">${single.name}</div>
            <div class="price-tag">${single.price.toLocaleString("ru-RU")} ⭐</div>
          `;
        } else {
          stage.innerHTML = `
            <div style="font-size:12px; color:var(--muted); margin-bottom:8px;">${t("dropped")} (x${wonItems.length})</div>
            <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:8px; max-width:340px;">
              ${wonItems.map(item => `
                <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:8px; width:96px; text-align:center;">
                  <div style="width:52px; height:52px; margin:0 auto 4px; border-radius:10px; background:var(--bg-card-2); display:grid; place-items:center; font-size:28px; overflow:hidden;">
                    ${renderGiftArt(item)}
                  </div>
                  <div style="font-size:11px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.name}</div>
                  <div style="font-size:11px; font-weight:800; color:var(--gold);">${item.price.toLocaleString("ru-RU")} ⭐</div>
                </div>
              `).join("")}
            </div>
          `;
        }

        state.busy = false;
      }, waitMs);
    }

    function getEffectiveStake() {
      if (state.selectedInvIndex !== null && state.inventory[state.selectedInvIndex]) {
        return state.inventory[state.selectedInvIndex].price;
      }
      const val = Number(document.getElementById("upgradeBetInput").value) || 0;
      return Math.max(0, val);
    }

    function recalcUpgrade() {
      const target = getGiftById(state.targetGiftId);
      const stake = getEffectiveStake();
      let rawChance = target.price > 0 ? (stake / target.price) * 100 : 0;
      const effectiveChance = stake > 0 ? Math.max(1, Math.min(24, rawChance * 0.25)) : 0;

      const deg = Math.round((effectiveChance / 100) * 360);
      document.getElementById("wheelRing").style.setProperty("--chance-deg", `${deg}deg`);
      document.getElementById("chanceDisplay").textContent = `${effectiveChance.toFixed(1)}%`;

      const fromBox = document.getElementById("fromSlotContent");
      if (state.selectedInvIndex !== null && state.inventory[state.selectedInvIndex]) {
        const invItem = state.inventory[state.selectedInvIndex];
        fromBox.innerHTML = `
          <div class="slot-title">${invItem.name}</div>
          <div class="slot-sub">${invItem.price.toLocaleString("ru-RU")} ⭐</div>
        `;
      } else {
        fromBox.innerHTML = `
          <div class="slot-title">${t("fromSlotTitle")}</div>
          <div class="slot-sub">${stake.toLocaleString("ru-RU")} ⭐</div>
        `;
      }

      document.getElementById("toSlotContent").innerHTML = `
        <div class="slot-title">${target.name}</div>
        <div class="slot-sub">${target.price.toLocaleString("ru-RU")} ⭐</div>
      `;

      return effectiveChance;
    }

    function setBetPercent(pct) {
      state.selectedInvIndex = null;
      const amount = Math.floor(state.balance * pct);
      document.getElementById("upgradeBetInput").value = amount;
      recalcUpgrade();
    }

    function toggleTurbo() {
      state.turbo = !state.turbo;
      document.getElementById("turboBtn").classList.toggle("active", state.turbo);
      document.getElementById("caseFsTurboBtn").classList.toggle("active", state.turbo);
      document.getElementById("pointerRotator").classList.toggle("turbo", state.turbo);
    }

    function toggleSound() {
      state.sound = !state.sound;
      document.getElementById("soundBtn").classList.toggle("active", state.sound);
    }

    function playTone(freq, duration) {
      if (!state.sound) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.value = freq;
        gain.gain.value = 0.08;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function runUpgrade() {
      if (state.busy) return;
      const target = getGiftById(state.targetGiftId);
      if (!target) return;

      const usingInv = state.selectedInvIndex !== null && state.inventory[state.selectedInvIndex];
      const stake = getEffectiveStake();
      const banner = document.getElementById("upgradeStatus");

      if (!usingInv && stake <= 0) return;
      if (!usingInv && state.balance < stake) {
        banner.textContent = `${t("notEnoughShort")} ⭐`;
        banner.className = "status-banner show lose";
        return;
      }

      const chance = recalcUpgrade();
      state.busy = true;
      document.getElementById("improveBtn").disabled = true;
      banner.className = "status-banner";

      if (usingInv) {
        state.inventory.splice(state.selectedInvIndex, 1);
        state.selectedInvIndex = null;
      } else {
        state.balance -= stake;
        updateBalanceUI();
      }

      const win = Math.random() * 100 < chance;
      const targetDeg = win
        ? Math.random() * Math.max(4, (chance / 100) * 360 - 4)
        : Math.min(358, (chance / 100) * 360 + 12 + Math.random() * 220);

      state.wheelAngle += 360 * 4 + targetDeg;
      document.getElementById("pointerRotator").style.transform = `rotate(${state.wheelAngle}deg)`;

      const waitMs = state.turbo ? 680 : 2450;
      setTimeout(() => {
        if (win) {
          state.inventory.unshift({ ...target, uid: Date.now() + Math.random() });
          renderInventory();
          banner.textContent = `${t("upgradeWin")} ${target.name} (${target.price.toLocaleString("ru-RU")} ⭐)!`;
          banner.className = "status-banner show win";
          playTone(740, 0.18);
        } else {
          banner.textContent = t("upgradeLoss");
          banner.className = "status-banner show lose";
          document.body.classList.remove("shake-loss");
          void document.body.offsetWidth;
          document.body.classList.add("shake-loss");
          playTone(180, 0.22);
        }
        recalcUpgrade();
        state.busy = false;
        document.getElementById("improveBtn").disabled = false;
      }, waitMs);
    }

    function openTargetPicker() {
      const grid = document.getElementById("targetGrid");
      grid.innerHTML = ALL_TELEGRAM_GIFTS.map(g => `
        <div class="gift-card ${g.id === state.targetGiftId ? "selected" : ""}" onclick="selectTarget('${g.id}')">
          <div class="gift-thumb">${renderGiftArt(g)}</div>
          <div class="gift-name">${g.name}</div>
          <div class="gift-price-bottom">${g.price.toLocaleString("ru-RU")} ⭐</div>
        </div>
      `).join("");
      document.getElementById("targetModal").classList.add("open");
    }

    function selectTarget(id) {
      state.targetGiftId = id;
      closeModal("targetModal");
      recalcUpgrade();
    }

    function openInventoryPicker() {
      const grid = document.getElementById("invPickerGrid");
      if (!state.inventory.length) {
        grid.innerHTML = `<div class="info-box" style="grid-column:1/-1;">${t("noInvItems")}</div>`;
      } else {
        grid.innerHTML = state.inventory.map((g, idx) => `
          <div class="gift-card ${state.selectedInvIndex === idx ? "selected" : ""}" onclick="selectInvItem(${idx})">
            <div class="gift-thumb">${renderGiftArt(g)}</div>
            <div class="gift-name">${g.name}</div>
            <div class="gift-price-bottom">${g.price.toLocaleString("ru-RU")} ⭐</div>
          </div>
        `).join("");
      }
      document.getElementById("invPickerModal").classList.add("open");
    }

    function selectInvItem(idx) {
      state.selectedInvIndex = idx;
      closeModal("invPickerModal");
      recalcUpgrade();
    }

    function clearSelectedInvGift() {
      state.selectedInvIndex = null;
      closeModal("invPickerModal");
      recalcUpgrade();
    }

    function renderCatalog() {
      const q = (document.getElementById("giftSearch").value || "").trim().toLowerCase();
      const filtered = ALL_TELEGRAM_GIFTS.filter(g => g.name.toLowerCase().includes(q));
      document.getElementById("catalogCount").textContent = `${filtered.length}`;
      document.getElementById("catalogGrid").innerHTML = filtered.map(g => `
        <div class="gift-card" onclick="selectTarget('${g.id}'); switchTab('upgrade');">
          <div class="gift-thumb">${renderGiftArt(g)}</div>
          <div class="gift-name">${g.name}</div>
          <div class="gift-price-bottom">${g.price.toLocaleString("ru-RU")} ⭐</div>
        </div>
      `).join("");
    }

    function renderInventory() {
      document.getElementById("inventoryCount").textContent = `${state.inventory.length}`;
      const grid = document.getElementById("inventoryGrid");
      if (!state.inventory.length) {
        grid.innerHTML = `<div class="info-box" style="grid-column:1/-1;">${t("noInvItems")}</div>`;
        return;
      }
      grid.innerHTML = state.inventory.map((g, idx) => `
        <div class="gift-card" onclick="sellInventoryItem(${idx})">
          <div class="gift-thumb">${renderGiftArt(g)}</div>
          <div class="gift-name">${g.name}</div>
          <div class="gift-price-bottom">${g.price.toLocaleString("ru-RU")} ⭐</div>
        </div>
      `).join("");
    }

    function sellInventoryItem(idx) {
      const item = state.inventory[idx];
      if (!item) return;
      state.balance += item.price;
      state.inventory.splice(idx, 1);
      if (state.selectedInvIndex === idx) state.selectedInvIndex = null;
      updateBalanceUI();
      renderInventory();
      recalcUpgrade();
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("open");
    }

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    applyTranslations();
    updateBalanceUI();
    renderCases();
    renderCatalog();
    renderInventory();
    recalcUpgrade();
  </script>
</body>
</html>
